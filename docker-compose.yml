name: kleva

# Nombres de contenedor con prefijo kleva_ y puertos de host configurables:
# el stack convive con otros proyectos locales (postgres_db, grafana, etc.).

services:
  db:
    image: postgres:16-alpine
    container_name: kleva_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5433}:5432" # expuesto para correr alembic/seed desde el host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    image: kleva-backend
    container_name: kleva_migrate
    env_file: [.env]
    environment:
      DB_HOST: db # dentro de la red de compose
      DB_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: . # misma imagen que migrate (sale de la caché)
    image: kleva-backend
    container_name: kleva_backend # nombre fijo: las queries de Loki lo usan
    restart: always
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: kleva-api
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    volumes:
      - ./app:/code/app:z # hot reload en desarrollo
    # un solo proceso: un solo dispatcher de llamadas
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: kleva_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: kleva_prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    depends_on: [backend]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: kleva_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

  loki:
    image: grafana/loki:3.5.0
    container_name: kleva_loki
    restart: always
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro,z
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: kleva_alloy
    restart: always
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    security_opt: [label=disable] # SELinux: permite leer el socket de Docker
    volumes:
      - ./monitoring/alloy.river:/etc/alloy/config.alloy:ro,z
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.8.0
    container_name: kleva_tempo
    restart: always
    user: root # escribe en el volumen /var/tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro,z
      - tempo_data:/var/tempo

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
