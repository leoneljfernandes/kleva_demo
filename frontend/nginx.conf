server {
    listen 80;
    root /usr/share/nginx/html;

    # mismo origen para la SPA y la API: sin CORS en contenedores
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";   # nombres con hash: cache largo seguro
    }

    # un archivo estático que no existe es un 404, no el index.html de la SPA:
    # un navegador que pide /favicon.ico y recibe HTML muestra una letra en vez del ícono
    location ~* \.(ico|png|svg|jpe?g|webp|woff2?|css|js|map|txt)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;   # rutas del router del cliente
    }
}
